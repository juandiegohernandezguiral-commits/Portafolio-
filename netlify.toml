# ============================================================================
# Netlify config — portafolio + backend, en UN SOLO SITIO
# ============================================================================
# Este archivo despliega las dos cosas a la vez desde el mismo dominio:
#   - el portafolio estático (index.html, css/, js/, imágenes) servido tal cual,
#     sin build step de ningún tipo
#   - las funciones serverless de /netlify/functions (sync de datos del panel,
#     proxy de Notion, suscripciones push) y el cron de vencimientos
#
# POR QUÉ UN SOLO SITIO Y NO DOS
# El diseño original los separaba (portafolio en Hostinger, funciones en
# Netlify). Unificarlos elimina de golpe tres cosas: las peticiones entre
# orígenes distintos y toda la configuración de CORS que arrastraban, la
# variable ALLOWED_ORIGIN, y subir archivos por FTP a mano cada vez que cambia
# algo. Ahora cada `git push` despliega el sitio entero.
#
# Cómo desplegar:
#   1. Cuenta gratuita en https://app.netlify.com
#   2. "Add new site" → "Import an existing project" → conecta ESTE repo de Git.
#      Importante: tiene que quedar enlazado al repositorio, no subido
#      arrastrando una carpeta — si no, no se despliega solo en cada push.
#   3. No toques "Base directory" ni "Publish directory" en la interfaz: este
#      archivo ya los define.
#   4. Configura las variables de entorno de la sección [functions] de abajo en
#      Netlify → Site configuration → Environment variables, y lanza un deploy
#      nuevo (las variables no se aplican al despliegue que ya estaba hecho).
#   5. La URL que te da Netlify es a la vez tu portafolio y la "URL del proxy"
#      que se pega en el panel → "Conectar cuentas".

[build]
  # La raíz del repo: no hay nada que compilar, los archivos se sirven tal cual.
  # Esto también publica docs/, tests/ y el código de las funciones como ficheros
  # estáticos. No es un problema de seguridad — el repositorio ya es público y
  # ningún secreto vive en el código (todos son variables de entorno) — pero
  # tenlo presente si alguna vez añades algo que no deba verse.
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

  # DEPENDENCIAS: viven en el package.json de la RAÍZ del repositorio, no en uno
  # dentro de netlify/functions. Netlify NO instala las de un package.json
  # anidado en la carpeta de funciones — el bundler falla con "Could not resolve
  # @netlify/blobs" y el despliegue entero se cae. Si añades una dependencia
  # nueva al backend, va en /package.json.
  # Variables de entorno que este backend necesita (configúralas en el panel de
  # Netlify, NUNCA las escribas aquí ni en el código fuente):
  #
  #   NOTION_TOKEN              — Internal Integration Secret de tu integración
  #                                de Notion (Settings → Connections → Develop
  #                                or manage integrations → crea una integración
  #                                interna, y comparte tu base de datos con ella)
  #   NOTION_DATABASE_ID        — ID de la base de datos de Notion (de su URL).
  #                                El proxy resuelve el data_source_id a partir
  #                                de este ID automáticamente. Alternativamente,
  #                                si ya conoces el data_source_id exacto, puedes
  #                                usar NOTION_DATA_SOURCE_ID en su lugar y te
  #                                ahorras una llamada extra por invocación.
  #   NOTION_DATA_SOURCE_ID     — (opcional) ID del data source, si lo prefieres
  #                                sobre NOTION_DATABASE_ID.
  #   NOTION_PROP_NAME          — (opcional) nombre de la propiedad "título" en
  #                                tu base de datos, si no es la única de tipo
  #                                title (se autodetecta por tipo si se omite)
  #   NOTION_PROP_DUE           — (opcional) nombre de la propiedad de fecha de
  #                                vencimiento (se autodetecta por tipo "date")
  #   NOTION_PROP_DONE          — (opcional) nombre de la propiedad de estado/
  #                                completado (checkbox, status o select — se
  #                                autodetecta por tipo si se omite)
  #   VAPID_PUBLIC_KEY          — clave pública VAPID (la misma que se pega en
  #                                el dashboard, en "Conectar cuentas" → Push)
  #   VAPID_PRIVATE_KEY         — clave privada VAPID — NUNCA debe salir de aquí
  #   VAPID_SUBJECT             — "mailto:tu-correo@ejemplo.com" (requerido por
  #                                el estándar web-push, identifica al remitente)
  #   PUSH_DUE_SOON_HOURS       — (opcional, default 24) horas antes del
  #                                vencimiento a partir de las cuales se notifica
  #   SYNC_TOKEN                — token compartido que protege /data/pull y
  #                                /data/push (el sync de tareas, notas, eventos
  #                                y proyectos del panel entre dispositivos).
  #                                SIN ESTA VARIABLE el endpoint rechaza todo
  #                                (falla cerrado, a propósito: un despliegue a
  #                                medio configurar no debe quedar abierto con
  #                                tus datos personales dentro). Genéralo con:
  #                                  node -e "console.log(require('crypto').randomBytes(32).toString('base64url'))"
  #                                y pega la misma cadena en el panel →
  #                                "Conectar cuentas" → Sincronización.
  #   ALLOWED_ORIGIN            — (opcional) ya NO hace falta: con el portafolio
  #                                y las funciones en el mismo dominio, el
  #                                navegador no hace peticiones entre orígenes y
  #                                CORS deja de intervenir. Sólo tiene sentido
  #                                si algún día sirves el panel desde otro sitio.
  #
  # Cómo generar las VAPID keys (no las inventes, corre esto tú mismo):
  #   npx web-push generate-vapid-keys
  # Te da un par { publicKey, privateKey } — la pública va también en el cliente
  # (no es secreta), la privada SOLO como variable de entorno aquí.

# Rutas "limpias" para que el cliente pueda hacer fetch a {proxyUrl}/notion/tasks
# en vez de {proxyUrl}/.netlify/functions/notion-tasks.
[[redirects]]
  from = "/notion/tasks"
  to = "/.netlify/functions/notion-tasks"
  status = 200

[[redirects]]
  from = "/push/subscribe"
  to = "/.netlify/functions/push-subscribe"
  status = 200

[[redirects]]
  from = "/sync/external-summary"
  to = "/.netlify/functions/sync-external-summary"
  status = 200

# Sync de los datos propios del panel (tareas, eventos, proyectos, notas) entre
# dispositivos. Protegido por SYNC_TOKEN — ver netlify/functions/_lib/auth.js.
[[redirects]]
  from = "/data/pull"
  to = "/.netlify/functions/data-sync"
  status = 200

[[redirects]]
  from = "/data/push"
  to = "/.netlify/functions/data-sync"
  status = 200

# Nota: scheduled-check-deadlines.js NO necesita redirect — no es accesible por
# HTTP desde el cliente, Netlify lo invoca internamente según el cron de abajo.

# Función programada: revisa vencimientos y dispara las notificaciones push.
# El cron se declara AQUÍ y no con el helper schedule() de @netlify/functions,
# para no arrastrar esa dependencia (sus versiones actuales exigen Node >= 22.12)
# sólo para envolver un handler. Sintaxis cron estándar, siempre en UTC.
[functions."scheduled-check-deadlines"]
  schedule = "*/30 * * * *"
